name: 构建与发布

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建
        run: mvn -B -U package

      - name: 读取版本号
        id: version
        run: echo "version=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MiaoChineseBC-${{ steps.version.outputs.version }}
          path: target/MiaoChineseBC-*.jar

      # 推送到 main 时，若 pom.xml 中的版本还没有对应的 Release，则自动创建 v<版本> 标签与 Release 并附上 jar
      - name: 发布 Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$VERSION" in *-SNAPSHOT) echo "快照版本 $VERSION 不发布"; exit 0;; esac
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION 已发布，跳过；如需发布新版本请修改 pom.xml 中的版本号"
            exit 0
          fi
          gh release create "v$VERSION" target/MiaoChineseBC-"$VERSION".jar \
            --target "$GITHUB_SHA" \
            --title "MiaoChineseBC $VERSION" \
            --generate-notes
